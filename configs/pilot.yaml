# Pilot: 8 GPU-hours. Measures memory, candidate search time, training speed,
# and the score gaps of wrong-year errors. Sets the run length for the main runs.
name: pilot
data: wikipedia
init_checkpoint: released_biencoder   # from the EVELINK archive
freeze_page_encoder: true
samplers: [uniform, resa2]            # short runs only
seeds: [0]
gpu_hours_limit: 8
updates: 1500
batch_size: 32                        # 4 micro-batches of 8
result: docs/results/pilot/           # valid R@10: released 77.7, uniform 90.0, resa2 92.0
